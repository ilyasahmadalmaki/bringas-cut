<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="cutGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff2a6d;#7b2ff7;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff2a6d">
        <animate attributeName="stop-color" values="#ff2a6d;#7b2ff7;#00f0ff;#ff2a6d" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00f0ff;#ff2a6d;#7b2ff7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="cutShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <text id="cutTitle" x="600" y="96" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="72" font-weight="900" letter-spacing="4">BRINGAS CUT</text>
    <clipPath id="cutClip">
      <use href="#cutTitle" xlink:href="#cutTitle"/>
    </clipPath>
  </defs>
  <use href="#cutTitle" xlink:href="#cutTitle" fill="url(#cutGrad)" filter="url(#cutGlow)"/>
  <rect x="0" y="0" width="220" height="200" fill="url(#cutShine)" clip-path="url(#cutClip)">
    <animateTransform attributeName="transform" type="translate" values="-280 0; 1300 0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="148" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" letter-spacing="5" fill="url(#cutGrad)">HYDRA TEAM BRINGAS • PERMUDAH HIDUPMU</text>
  <rect x="200" y="172" width="800" height="3" rx="1.5" fill="url(#cutGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
